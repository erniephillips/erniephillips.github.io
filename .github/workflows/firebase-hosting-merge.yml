# Firebase Hosting live deployment for the EPATA LLC site.
# GitHub Pages is deployed separately by GitHub's built-in Pages workflow.

name: Firebase Hosting - Live Deploy

run-name: Firebase live deploy to ernie-phillips-portfolio from ${{ github.ref_name }}

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy_firebase_live:
    name: Deploy EPATA site to Firebase Hosting live channel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout static site files
        uses: actions/checkout@v4

      - name: Deploy repo root to Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ERNIE_PHILLIPS_PORTFOLIO }}'
          channelId: live
          projectId: ernie-phillips-portfolio
