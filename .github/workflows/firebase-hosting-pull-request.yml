# Firebase Hosting preview deployment for pull requests.
# This is separate from the live Firebase deploy and GitHub Pages deploy.

name: Firebase Hosting - Pull Request Preview

run-name: Firebase preview deploy from ${{ github.ref_name }}

on:
  pull_request:
  workflow_dispatch:

jobs:
  deploy_firebase_preview:
    name: Deploy EPATA site to Firebase Hosting preview channel
    if: '${{ github.event_name == ''workflow_dispatch'' || github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout static site files
        uses: actions/checkout@v4

      - name: Deploy repo root to Firebase Hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ERNIE_PHILLIPS_PORTFOLIO }}'
          projectId: ernie-phillips-portfolio
